[project]
name = "systematic-futures"
version = "0.1.0"
description = "Systematic futures: a method-comparison lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "optuna>=4.0",
]

[dependency-groups]
dev = [
    "plotly<6",
    "pytest>=8.0",
    "ruff>=0.6",
    "vectorbt>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/systematic_futures"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["systematic_futures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
